[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solveDaCube"
version = "1.0.0"
description = "An interactive ASCII terminal Rubik's Cube solver — From the minds of IBM Bob & Daneyand"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["rubiks-cube", "cube", "solver", "kociemba", "terminal", "tui", "ascii", "puzzle"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = [
    "kociemba",
    "rich",
    "readchar",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
solveDaCube = "solveDaCube.main:main"

[project.urls]
Homepage = "https://github.com/007Style/solveDaCube"
Source = "https://github.com/007Style/solveDaCube"
Issues = "https://github.com/007Style/solveDaCube/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}
